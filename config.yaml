# All frozen settings for the project. Change only with a documented reason.

data:
  raw_dir: data/raw                 # NoAuction + ZScore files only
  processed_path: data/processed/fi2010.pkl
  n_features: 144                   # rows 0-143 of each file
  label_rows: {k1: 144, k2: 145, k3: 146, k5: 147, k10: 148}
  target: k10                       # one horizon only
  # Stored labels look backward: label_k10 at row r describes the move starting at r - 9
  # (step 1 check, 97.7% agreement). Target for row t = stored label_k10 at row t + 9,
  # same stock-day. The last 9 rows of each stock-day have no target (target = -1).
  target_shift: 9
  horizon_snapshots: 10             # target at t uses mid up to t + 10 -> usable after t + 10
  # Raw label values -> internal class ids (verified in step 1, see check_data.py)
  label_map: {1: 0, 2: 1, 3: 2}     # 1 = Up, 2 = Stationary, 3 = Down
  n_stocks_per_day: 5
  # Each fold file is z-scored with stats of days 1..k. All days are mapped (exact
  # per-feature affine maps) onto the scale of Train_CF_5 = stats of training days 1-5.
  scale_ref_fold: 5

splits:
  train: [1, 2, 3, 4, 5]
  validation: [6]
  stream: [7, 8]
  test: [9, 10]

# Step 2: V1 classifiers. All use class_weight=balanced. Features already z-scored.
models:
  seed: 0
  # Nine features are constant across all 10 days (step 1); drop them everywhere.
  drop_features: [f129, f130, f131, f135, f136, f137, f141, f142, f143]
  # RBF SVM fit cost is quadratic; a full-train fit extrapolates to ~40 min and cannot
  # be retrained in step 3. So SVM is fit on a fixed seeded stratified subsample, and the
  # same cap applies when it retrains in step 3 (user decision, step 2).
  svm_subsample: 20000
  svm_calibration_cv: 3             # probability calibration folds, training data only
  svm_calibration_method: sigmoid   # Platt scaling; isotonic needs more data per fold
  # Small documented grid per model; selection is by validation (day 6) macro-F1.
  grids:
    logreg: {C: [0.1, 1.0, 10.0]}
    knn: {n_neighbors: [25, 50, 100], weights: [uniform, distance]}
    svm_rbf: {C: [1.0, 10.0], gamma: [scale]}
  # --- harness block appended below models for readability; see 'harness:' ---
  # Chosen V1, frozen for all policy experiments. Logistic regression won the
  # validation (day 6) macro-F1 (0.455 vs KNN 0.436, calibrated RBF SVM 0.413) and
  # is the cheapest to retrain. The three C values tied within 0.0002 (noise), so we
  # freeze C=1.0, the default middle-of-grid value, over the nominal winner C=10.
  v1: {model: logreg, params: {C: 1.0}}

# Step 3: replay harness over days 7-8.
harness:
  window: 1000            # W: snapshots per window (start value, reviewed on validation)
  budget: 50             # B: samples a policy may add per window
  gate_tolerance: 0.005  # accept candidate if val macro-F1 >= current - this
  runs_db: runs.db
  # A sample at stream position p is labellable at p + horizon_snapshots, so it joins
  # the pool of window (p + horizon_snapshots)//W. This carries the last `horizon`
  # samples of each window into the next (leakage rule 1). horizon_snapshots is in data:.

# Step 4: selection policies. Uncertainty = predictive entropy throughout.
# C and D are deterministic; the seed only affects stochastic policies (B, E).
policies:
  density_k: 10            # D: neighbours for the local-density estimate (within pool)
  audit_share: 0.2         # E: fraction of B reserved for confident-random audit samples
  confident_quantile: 0.5  # E: pool fraction with the lowest entropy counted as "confident"
  shortlist_factor: 3      # E: shortlist = factor x (cluster budget) most uncertain
  pca_components: 10        # E: PCA dimensions before k-means
